[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdh-app-timers"
version = "1.0.0"
description = "Black Diamond Hub app: named kitchen timers and alarms with spoken alerts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bdh-sdk[ha]>=0.19,<1",
]

[project.urls]
Source = "https://github.com/blackdiamondlodge/bdh-app-timers"

[project.entry-points."blackdiamondhub.plugins"]
timers = "timers.plugin:spec"

[tool.setuptools.packages.find]
include = ["timers", "timers.*"]

[tool.setuptools.package-data]
timers = [
    "templates/**/*",
    "static/**/*",
]
