{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ timer.name }}</title>
{% comment %}
Shown inside the hub's alert pop-up (16:9 iframe). PERFORMANCE: weak display
GPUs, so the dial is redrawn once a second and only opacity animates.
{% endcomment %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #eef3fa; background: radial-gradient(ellipse 110% 90% at 30% 20%, #22314d 0%, #101722 60%, #07090d 100%); }
  .w { height: 100%; display: flex; align-items: center; justify-content: center; gap: 6vw; padding: 0 5vw; box-sizing: border-box; }
  #dial { flex: none; width: min(78vh, 46vw); height: min(78vh, 46vw); }
  #dial svg { width: 100%; height: 100%; }
  .side { display: flex; flex-direction: column; gap: 2.4vh; min-width: 0; }
  h1 { margin: 0; font-size: 7vh; font-weight: 300; line-height: 1.1; overflow-wrap: anywhere; }
  p { margin: 0 0 2vh; color: #ffb35c; font-size: 3.4vh; letter-spacing: .12em; font-weight: 600; }
  button { font: inherit; font-size: 3.6vh; border: 0; border-radius: 999px; padding: 2.2vh 4.4vh; cursor: pointer;
    color: #dbe6f5; background: rgba(255,255,255,.08); display: inline-flex; gap: 1.6vh; align-items: center; justify-content: center; }
  button.warn { background: rgba(255,120,80,.22); color: #ffb08a; }
  button:active { opacity: .7; }
  .err { color: #ff9c8a; font-size: 2.6vh; min-height: 3vh; }
</style>
</head>
<body>
{% csrf_token %}
<div class="w">
  <div id="dial"></div>
  <div class="side">
    <h1 id="name">{{ timer.name }}</h1>
    <p id="sub">TIME'S UP</p>
    <button class="warn" data-act="silence"><i class="fa-solid fa-bell-slash"></i>Stop</button>
    <button data-act="add"><i class="fa-solid fa-plus"></i>1 minute</button>
    <div class="err" id="err"></div>
  </div>
</div>
{{ timer|json_script:"tm-timer" }}
<script src="{% static 'timers/dial.js' %}"></script>
<script>
(function () {
  const D = window.TimersDial, id = JSON.parse(document.getElementById("tm-timer").textContent).id;
  const base = "{% url 'timers_index' %}";
  let t = JSON.parse(document.getElementById("tm-timer").textContent);
  let state = D.localize({timers: [t]});
  function draw() {
    const cur = state.timers[0] ? D.live(state.timers[0]) : null;
    if (!cur) return;
    document.getElementById("dial").innerHTML = D.dial(cur, "100%");
    document.body.className = cur.state;
    document.getElementById("sub").textContent =
      cur.state === "ring" ? "TIME'S UP" : cur.state === "run" ? "+1 MIN ADDED" : cur.state.toUpperCase();
  }
  document.addEventListener("click", async e => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    try {
      const s = await D.post(`${base}api/timers/${id}/${b.dataset.act}/`);
      state = D.localize({timers: s.timers.filter(x => x.id === id)});
      draw();
    } catch (err) { document.getElementById("err").textContent = err.message; }
  });
  draw();
  setInterval(draw, 1000);
})();
</script>
</body>
</html>
